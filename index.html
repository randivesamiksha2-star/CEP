<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CROP ADVISORY PORTAL</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-light">

  <!-- MAIN ADVISORY CONTENT -->
<div id="mainContent" class="container my-4 p-4 rounded shadow">
    <h1 class="text-center text-success mb-4">CROP ADVISORY PORTAL</h1>

    <!-- Logout Button -->
    <div class="text-end mb-3">
      <button onclick="logout()" class="btn btn-danger">Logout</button>


    </div>



    <!-- Farm image -->

<img src="images/background_main.jpeg" class="img-fluid rounded mx-auto d-block mb-4" alt="Farm field">


    <!-- Location Input -->
    <input type="text" id="location" class="form-control mb-3" placeholder="Enter your city or village" required />

    <!-- Date Input -->
    <label for="date" class="form-label fw-bold">Select Date:</label>
    <input type="date" id="date" class="form-control mb-4" />

    <!-- Buttons -->
    <div class="d-flex gap-3 mb-4">
      <button class="btn btn-success flex-fill" data-activity="sowing">Sowing</button>
      <button class="btn btn-success flex-fill" data-activity="harvesting">Harvesting</button>
      <button class="btn btn-success flex-fill" data-activity="irrigation">Irrigation</button>
    </div>

    <!-- Images Row (Card Layout) -->
<div class="row text-center mb-4 g-4">

  <div class="col-md-4">
    <div class="card h-100">
<img src="images/sowing.jpg" class="card-img-top fixed-img" alt="Sowing">
      <div class="card-body">
        <h5 class="card-title">Sowing</h5>
      </div>
    </div>
  </div>

  <div class="col-md-4">
    <div class="card h-100">
      <img src="images/harvesting.jpeg" class="card-img-top fixed-img" alt="Harvesting">

      <div class="card-body">
        <h5 class="card-title">Harvesting</h5>
      </div>
    </div>
  </div>

  <div class="col-md-4">
    <div class="card h-100">
<img src="images/irr2.jpeg" class="card-img-top fixed-img" alt="Irrigation">
      <div class="card-body">
        <h5 class="card-title">Irrigation</h5>
      </div>
    </div>
  </div>

</div>



    <!-- Suggestion Box -->
    <div id="suggestion" class="alert text-center d-none" role="alert"></div>

    <!-- Legend -->
    <div class="card mt-4">
      <div class="card-body">
        <h5 class="card-title text-success">Legend: Rain Levels</h5>
        <p><span class="legend-color heavy-rain"></span> Heavy Rain (≥ 5mm)</p>
        <p><span class="legend-color light-rain"></span> Light Rain (&lt; 5mm)</p>
        <p><span class="legend-color no-rain"></span> No Rain</p>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Custom JS -->
  <script src="script.js"></script>

  <!-- Optional: set dynamic date -->
  <script>
    const dateInput = document.getElementById("date");
    const today = new Date().toISOString().split("T")[0];
    dateInput.min = today;
  </script>
</body>
</html>
