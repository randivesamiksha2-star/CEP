<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login - CROP ADVISORY PORTAL</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body class="bg-light d-flex justify-content-center align-items-center vh-100">
  <div class="card p-4 shadow" style="width: 400px;">
    <h2 class="text-center text-success mb-4">CROP ADVISORY PORTAL</h2>
    

    <!-- Toggle buttons -->
    <div class="text-center mb-3">
      <button id="showLogin" class="btn btn-success btn-sm me-2">Login</button>
      <button id="showRegister" class="btn btn-outline-success btn-sm">Register</button>
    </div>

    <!-- Login Form -->
    <form id="loginForm">
      <input type="text" id="loginUsername" class="form-control mt-3" placeholder="Username" />
      <input type="password" id="loginPassword" class="form-control mt-3" placeholder="Password" />
      <div id="loginErrorMsg" class="text-danger small mt-2"></div>
      <button type="submit" class="btn btn-success w-100 mt-3">Login</button>
      <button type="button" class="btn btn-link w-100 mt-2" onclick="location.href='front.html'">Back Home</button>
    </form>

    <!-- Register Form -->
    <form id="registerForm" style="display:none;">
      <input type="text" id="regUsername" class="form-control mt-3" placeholder="Choose Username" />
      <input type="password" id="regPassword" class="form-control mt-3" placeholder="Password" />
      <input type="password" id="regConfirmPassword" class="form-control mt-3" placeholder="Confirm Password" />
      <div id="registerErrorMsg" class="text-danger small mt-2"></div>
      <div id="registerSuccessMsg" class="text-success small mt-2"></div>
      <button type="submit" class="btn btn-success w-100 mt-3">Register</button>
      <button type="button" class="btn btn-link w-100 mt-2" onclick="showLogin.click()">Back to Login</button>
    </form>
  </div>

  

  <script src="script.js"></script>
</body>
</html>
